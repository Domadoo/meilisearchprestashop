name: PHP tests
on: [push, pull_request]
concurrency:
  group: ${{ github.event_name }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  php-linter:
    name: PHP Syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP syntax checker 7.4
        uses: prestashop/github-action-php-lint/7.4@master
      - name: PHP syntax checker 8.1
        uses: prestashop/github-action-php-lint/8.1@master
      - name: PHP syntax checker 8.2
        uses: prestashop/github-action-php-lint/8.2@master
      - name: PHP syntax checker 8.3
        uses: prestashop/github-action-php-lint/8.3@master

  php-cs-fixer:
    name: PHP-CS-Fixer
    runs-on: ubuntu-latest
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: php-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHP-CS-Fixer
        run: ./vendor/bin/php-cs-fixer fix --dry-run --diff --using-cache=no

  phpstan:
    name: PHPStan (${{ matrix.presta-version }}, PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - presta-version: '1.7.8.11'
            php-version: '7.4'
            phpstan-version: '^1.10'
          - presta-version: '8.0.5'
            php-version: '7.4'
            phpstan-version: '^1.10'
          - presta-version: '9.0.3'
            php-version: '8.1'
            phpstan-version: '^1.10'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: ${{ github.event.repository.name }}

      - uses: PrestaShop/.github/.github/actions/php-ci/phpstan@master
        with:
          php-version: ${{ matrix.php-version }}
          presta-version: ${{ matrix.presta-version }}
          module-name: ${{ github.event.repository.name }}
          phpstan-level: '5'
          phpstan-config: 'tests/php/phpstan/phpstan-${{ matrix.presta-version }}.neon'
          phpstan-version: ${{ matrix.phpstan-version }}
          phpstan-config-merge: 'false'
